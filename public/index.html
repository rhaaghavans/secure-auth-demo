<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secure Auth Demo</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="card">
      <h1>Secure Auth Demo</h1>
      <p class="muted">Create an account or sign in to your local account.</p>
      <div id="message" role="status" aria-live="polite"></div>
      <form id="auth-form">
        <label>Email <input name="email" type="email" autocomplete="email" required maxlength="254"></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" minlength="12" required></label>
        <div class="actions">
          <button type="submit" data-action="login">Log in</button>
          <button type="button" class="secondary" data-action="signup">Sign up</button>
        </div>
      </form>
      <button id="logout" class="secondary hidden">Log out</button>
      <p id="account" class="account"></p>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
